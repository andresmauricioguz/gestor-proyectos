<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Proyecto · Gestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body {
            background: #f8fafc;
        }
        .detalle-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .detalle-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }
        /* Para darle un toque más refinado a los campos */
        .campo-label {
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 font-sans antialiased">

    <div class="w-full max-w-2xl bg-white/70 backdrop-blur-sm rounded-3xl shadow-xl p-6 md:p-10 border border-white/40">

        <!-- Cabecera con navegación simple (estilo consistente) -->
        <div class="flex items-center gap-3 mb-8 border-b border-slate-200/80 pb-5">
            <div class="bg-indigo-100 p-3 rounded-xl text-indigo-600">
                <i class="fa-regular fa-folder-open text-2xl"></i>
            </div>
            <div class="flex-1">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                    Detalle del proyecto
                </h1>
                <p class="text-sm text-slate-500 font-light">
                    Información completa del proyecto seleccionado
                </p>
            </div>
            <!-- Enlace para volver a la lista (misma línea visual) -->
            <a href="{% url 'proyectos' %}" 
               class="inline-flex items-center gap-1.5 px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-xl border border-slate-200/60 hover:bg-slate-200 hover:border-slate-300 transition-all duration-150 shadow-sm hover:shadow">
                <i class="fa-regular fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>
        </div>

        <!-- Tarjeta de detalle (con los campos requeridos) -->
        <div class="detalle-card bg-white rounded-2xl p-6 md:p-8 border border-slate-100 shadow-sm">

            <!-- Nombre del proyecto (destacado) -->
            <div class="flex items-start gap-3 mb-6">
                <div class="bg-indigo-50 p-2.5 rounded-xl text-indigo-500 mt-0.5">
                    <i class="fa-solid fa-tag"></i>
                </div>
                <div>
                    <h2 class="text-xl md:text-2xl font-bold text-slate-800 break-words">
                        {{ proyecto.nombre }}
                    </h2>
                    <span class="inline-block mt-1.5 text-xs font-mono bg-indigo-50 text-indigo-600 px-3 py-0.5 rounded-full border border-indigo-100/70">
                        <i class="fa-regular fa-hashtag mr-1"></i> ID: {{ proyecto.id }}
                    </span>
                </div>
            </div>

            <!-- Descripción (campo requerido) -->
            <div class="flex items-start gap-3 mb-6 border-t border-slate-100 pt-5">
                <div class="bg-slate-50 p-2.5 rounded-xl text-slate-400 mt-0.5">
                    <i class="fa-regular fa-align-left"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider campo-label">
                        Descripción
                    </p>
                    <p class="text-base text-slate-700 leading-relaxed mt-1 break-words">
                        {{ proyecto.descripcion }}
                    </p>
                </div>
            </div>

            <!-- Duración (campo requerido) -->
            <div class="flex items-start gap-3 border-t border-slate-100 pt-5">
                <div class="bg-slate-50 p-2.5 rounded-xl text-slate-400 mt-0.5">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider campo-label">
                        Duración estimada
                    </p>
                    <p class="text-base text-slate-700 font-medium mt-1 flex items-center gap-2">
                        <span class="bg-indigo-50/70 px-3 py-1 rounded-full text-indigo-700 border border-indigo-100/60">
                            {{ proyecto.duracion }}
                        </span>
                        <span class="text-xs text-slate-400 font-light">(tiempo estimado)</span>
                    </p>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- BOTÓN DE EDITAR AGREGADO AQUÍ              -->
            <!-- ========================================== -->
            <div class="mt-6 pt-6 border-t-2 border-slate-100">
                <a href="{% url 'editar_proyecto' proyecto.id %}" 
                   class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 hover:shadow-lg transition-all duration-200 shadow-md hover:shadow-indigo-200/50 w-full sm:w-auto justify-center">
                    <i class="fa-regular fa-pen-to-square"></i>
                    <span>Editar proyecto</span>
                </a>
            </div>
            <!-- ========================================== -->

        </div>

        <!-- Pie con información sutil -->
        <div class="mt-6 text-xs text-slate-400/80 flex justify-between items-center">
            <span class="flex items-center gap-1.5">
                <i class="fa-regular fa-circle-check text-emerald-400"></i>
                Vista detallada
            </span>
            <span class="flex items-center gap-1.5">
                <i class="fa-regular fa-arrow-right"></i>
                <a href="{% url 'proyectos' %}" class="hover:text-indigo-500 transition-colors">
                    Ir a la lista
                </a>
            </span>
        </div>

    </div>

</body>
</html>
